# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: DreamAnnotate
        uses: alexkar598/DreamAnnotate/@67354dcd99fe4f980d9887f04e0109472de0fccb
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
            echo "Setting up BYOND."
            rm -rf "$HOME/BYOND"
            mkdir -p "$HOME/BYOND"
            cd "$HOME/BYOND"
            curl -H "User-Agent: tgstation/1.0 CI Script" "http://www.byond.com/download/build/516/516.1648_byond_linux.zip" -o byond.zip
            unzip byond.zip
            rm byond.zip
            cd byond
            make here
            echo "$BYOND_MAJOR.$BYOND_MINOR" > "$HOME/BYOND/version.txt"
            cd ~/
            wget "https://github.com/SpaceManiac/SpacemanDMM/releases/download/suite-1.11/dreamchecker"
            chmod +x dreamchecker

      - run: LD_LIBRARY_PATH=$HOME/BYOND/byond/bin $HOME/BYOND/byond/bin/DreamMaker test.dme
        if: always()

      - run: ~/dreamchecker
        if: always()
